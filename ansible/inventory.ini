# Инвентарь FireWyrm (СЭДД).
#
# Используется, если не задан -i. На управляющем узле обычно удобнее взять рабочий
# инвентарь со всеми переменными подключения:
#     ansible-playbook -i /etc/ansible/hosts install.yml -e fw_hosts=ws-01,ws-02,ws-03

[firewyrm]
ws-01
ws-02
ws-03

# Локальная установка на текущей машине (запуск из-под root: su -).
# [firewyrm]
# localhost ansible_connection=local
