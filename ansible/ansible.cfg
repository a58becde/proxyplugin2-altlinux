[defaults]
inventory = inventory.ini
interpreter_python = auto_silent
# Как в /etc/ansible/ansible.cfg на управляющем узле: этот файл его перекрывает,
# когда ansible-playbook запускается из каталога ansible/.
host_key_checking = False

[privilege_escalation]
# Для ad-hoc команд (ansible -b ...). Плейбуки задают become_method: su сами,
# потому что этот файл читается только из текущего каталога.
become_method = su
